name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # The whole repo, notebooks included; legacy exceptions live in the root pyproject.toml.
      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  discover:
    name: Find test suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4

      # One job per tests/<folder>, so a failing app shows up by name. (The whole suite
      # also runs in one go: `pytest tests -m "not live"`.) tests/live needs a real server.
      - id: list
        run: |
          suites=$(find tests -mindepth 1 -maxdepth 1 -type d ! -name live ! -name __pycache__ \
            -printf '%f\n' | sort | jq -R . | jq -cs .)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  test:
    name: "Tests: ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    needs: [lint, discover]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared package and app dependencies
        run: |
          pip install -e shared/
          pip install -r requirements.txt pytest pytest-mock

      - name: Run tests (no live)
        run: python -m pytest tests/${{ matrix.suite }}/ -v -m "not live"
