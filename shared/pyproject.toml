[project]
name = "perotf-utils"
version = "1.0.0"
description = "Shared utilities for the peroTF NOMAD analysis apps"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "plotly",
    "ipywidgets",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perotf_utils"]
