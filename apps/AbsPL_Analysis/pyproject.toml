[project]
name = "abspl-analysis"
version = "1.0.0"
description = "Absolute photoluminescence (AbsPL/PLQY) analysis dashboard for NOMAD Oasis batches"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "plotly>=5.0",
    "requests>=2.28",
    "scipy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
