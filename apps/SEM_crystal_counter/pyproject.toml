[project]
name = "sem-crystal-counter"
version = "1.0.0"
description = "Crystal and grain size analysis of SEM images"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-image>=0.19",
    "scikit-learn>=1.0",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
