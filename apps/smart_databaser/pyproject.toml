[project]
name = "smart-databaser"
version = "1.0.0"
description = "Build the experiment Excel for NOMAD with values autofilled live from earlier batches"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "natsort>=8.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

# Excel_creator's sheet_experiment / experiment_excel_builder are imported directly;
# bootstrap.py (and the tests' app_loader) make apps/Excel_creator importable for this.
[tool.perotf]
uses-apps = ["Excel_creator"]
