[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "global-analyzer"
version = "1.0.0"
description = "Global Analyzer: process parameters against measured results across many samples"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    # Data / validation
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    # Machine learning (Random Forest / Bayesian Optimization tabs)
    "scikit_learn>=1.8",
    "scipy>=1.17",
    # Visualisation; plotly>=6.1's go.FigureWidget needs anywidget
    "plotly>=5.0",
    "anywidget>=0.9",
    "ipywidgets>=8.0",
    "ipython>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
