[project]
name = "xrd-pf"
version = "1.0.0"
description = "Load XRD diffractograms from NOMAD, overlay patterns, detect peaks and fit peak profiles"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "lmfit>=1.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "anywidget",  # plotly>=6 FigureWidget needs it
    "requests>=2.31",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
