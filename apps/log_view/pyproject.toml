[project]
name = "log-view"
version = "1.0.0"
description = "Usage dashboard over the notebook usage log written by perotf_utils"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "pandas>=2.0",
    "plotly>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
