[project]
name = "data-tools"
version = "1.0.0"
description = "File conversion tools: IV converter, UV-Vis merger, JV organizer, ELN renamer, EQE splitter"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
