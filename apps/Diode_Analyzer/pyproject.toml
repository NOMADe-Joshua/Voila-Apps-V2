[project]
name = "diode-analyzer"
version = "1.0.0"
description = "Single diode model fitting of LED current-voltage curves"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "pvlib>=0.9",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
