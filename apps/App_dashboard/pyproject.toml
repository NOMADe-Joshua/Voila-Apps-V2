[project]
name = "app-dashboard"
version = "1.0.0"
description = "App Dashboard: launch page for all peroTF analysis apps"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
