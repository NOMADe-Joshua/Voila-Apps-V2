[project]
name = "data-overview-machines"
version = "1.0.0"
description = "Overview of samples, depositions and JV measurements created in a chosen date range"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
