[project]
name = "process-jv-overview"
version = "1.0.0"
description = "Per-batch overview correlating processing steps with JV boxplots by variation"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "numpy>=1.23",
    "openpyxl>=3.1",
    "pandas>=1.5",
    "plotly>=5.0",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
