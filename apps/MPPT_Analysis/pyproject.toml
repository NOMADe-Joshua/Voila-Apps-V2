[project]
name = "mppt-analysis"
version = "2.0.0"
description = "MPPT stability analysis: per-pixel fits, figures of merit, write-back to NOMAD"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "anywidget>=0.9",  # go.FigureWidget needs it
    "lmfit>=1.3",
    "numpy>=1.24",
    "openpyxl>=3.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
