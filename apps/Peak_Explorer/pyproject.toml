[project]
name = "peak-explorer"
version = "1.0.0"
description = "Photoluminescence peak detection and multi-peak fitting explorer"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "lmfit>=1.3",
    "numpy>=1.24",
    "openpyxl>=3.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "anywidget",  # plotly>=6 FigureWidget needs it
    "scipy>=1.10",
    "tqdm>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
