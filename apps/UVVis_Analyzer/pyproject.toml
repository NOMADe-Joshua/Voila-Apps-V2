[project]
name = "uvvis-analyzer"
version = "1.0.0"
description = "Load UV-Vis measurements from NOMAD, plot spectra and extract bandgaps (derivative and Tauc)"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.18",
    "requests>=2.31",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
