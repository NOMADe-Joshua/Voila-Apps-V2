[project]
name = "designofexperiments"
version = "1.0.0"
description = "Design of Experiments: define variables, generate sampling plans and export experimental designs"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
