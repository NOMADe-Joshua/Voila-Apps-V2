[project]
name = "entry-auditor"
version = "1.0.0"
description = "Find inconsistent field values in the NOMAD entries of a batch and correct them"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipywidgets>=8.0",
    "pandas>=2.0",
    "natsort>=8.0",
    "pydantic>=2.0",
    "pyyaml>=5.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
