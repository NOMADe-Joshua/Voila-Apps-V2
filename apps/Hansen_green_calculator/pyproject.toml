[project]
name = "hansen-green-calculator"
version = "1.0.0"
description = "Hansen solubility parameter and UNIFAC calculators for green solvent blends"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "openpyxl>=3.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "anywidget",  # plotly>=6 FigureWidget needs it
    "scipy>=1.10",
    "setuptools<81",  # pkg_resources (removed in setuptools 81), imported by data_visualizer.ipynb
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
