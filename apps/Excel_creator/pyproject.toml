[project]
name = "excel-creator"
version = "1.0.0"
description = "Build Excel templates for a fabrication process sequence, ready for upload to NOMAD"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
