[project]
name = "uvvis-simulator"
version = "1.0.0"
description = "UV-Vis layer stack simulator (transfer matrix method)"
requires-python = ">=3.10"
dependencies = [
    "perotf-utils",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "xlrd>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
